<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#0A1424"/>

  <!-- schematic registration circle -->
  <circle cx="32" cy="33" r="24" fill="none" stroke="#EAF2FF" stroke-width="1.3" opacity="0.35"/>
  <!-- tick marks -->
  <g stroke="#EAF2FF" stroke-width="1.3" opacity="0.35">
    <line x1="32" y1="5" x2="32" y2="10"/>
    <line x1="32" y1="56" x2="32" y2="61"/>
    <line x1="4" y1="33" x2="9" y2="33"/>
    <line x1="55" y1="33" x2="60" y2="33"/>
  </g>

  <!-- monoline "R", drawn as a single-weight technical stroke -->
  <path
    d="M22,48 L22,16 H33 C39,16 42,19 42,23.5 C42,28 38,30.5 32,30.5 H22"
    fill="none" stroke="#EAF2FF" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"
  />
  <path
    d="M30,30.5 L43,48"
    fill="none" stroke="#EAF2FF" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- blue-violet terminal / connection pin -->
  <circle cx="50.5" cy="49" r="3.4" fill="#8C7CFF"/>
</svg>
